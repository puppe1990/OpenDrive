name: Secrets

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  diff-scan:
    name: Diff scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan the diff for credentials
        run: |
          set -e

          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || RANGE="HEAD^..HEAD"
          fi

          git diff -U0 "$RANGE" > /tmp/diff.txt

          # GitHub's push protection does not know Backblaze application keys, so
          # this guards the shapes that have leaked before. Patterns are split so
          # this file does not match itself.
          PATTERNS="K005[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|aws_secret""_access_key|-----BEGIN [A-Z ]*PRIVATE KEY-----"

          MATCHES=$(grep -nE "$PATTERNS" /tmp/diff.txt | grep -v '^[0-9]*:+++' | head -10 || true)

          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Possível credencial no diff. Use placeholders em testes e configure os segredos no painel."
            exit 1
          fi

          echo "Nenhuma credencial encontrada no diff."
